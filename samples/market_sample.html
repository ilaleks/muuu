<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Market Sample</title>
</head>
<body>
  <table class="marketTable">
    <thead>
      <tr>
        <th>Предмет</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>Описание</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Dragon Slayer +13</td>
        <td>1500 WCoin</td>
        <td>PlayerOne</td>
        <td>Дополнительный урон +28</td>
      </tr>
      <tr>
        <td>Excellent Armor</td>
        <td>750,000,000 Zen</td>
        <td>Hero123</td>
        <td>Сет из 5 предметов</td>
      </tr>
    </tbody>
  </table>
  <div class="market-grid">
    <div class="market-item">
      <div class="item-title">Wings of Storm</div>
      <div class="item-price">2000 WCoin</div>
      <div class="item-seller">BestSeller</div>
      <div class="item-details">Скорость +10%</div>
    </div>
  </div>
</body>
</html>
